<section class="section objects-slider">
    <div class="objects-slider__container">
        {{#if label}}
        <p class="objects-slider__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="objects-slider__title title">{{{title}}}{{#if accent}} <span>{{{accent}}}</span>{{/if}}</h2>
        {{/if}}

        {{#if text}}
        <p class="objects-slider__text">{{{text}}}</p>
        {{/if}}

        <div class="objects-slider__wrap" data-objects-slider>
            <div class="objects-slider__slider swiper">
                <div class="swiper-wrapper">
                    {{> @partial-block }}
                </div>
            </div>

            {{> Ui/SliderNav }}
        </div>
    </div>
</section>
