<nav class="swiper-nav{{#if light}} swiper-nav--light{{/if}}" aria-label="Навігація слайдера"{{#if scroll}} data-scroll-nav{{/if}}>
    <button type="button" class="swiper-button-prev" aria-label="Попередній слайд"{{#if scroll}} data-scroll-prev{{/if}}>
        <svg class="icon" aria-hidden="true">
            <use href="@img/sprite.svg#icon-arrow-prev"></use>
        </svg>
    </button>
    <span class="swiper-nav__dot" aria-hidden="true"></span>
    <button type="button" class="swiper-button-next" aria-label="Наступний слайд"{{#if scroll}} data-scroll-next{{/if}}>
        <svg class="icon" aria-hidden="true">
            <use href="@img/sprite.svg#icon-arrow-next"></use>
        </svg>
    </button>
</nav>
