<section class="section benefits">
    <div class="benefits__bg" aria-hidden="true">
        <img src="@img/bg-sunsay.svg" alt="" width="1920" height="1080" />
    </div>

    <div class="benefits__container" data-scroll-slider>
        {{#if label}}
            <p class="benefits__label title-label">{{label}}</p>
        {{else}}
            <p class="benefits__label title-label">Наші переваги</p>
        {{/if}}

        <h2 class="benefits__title title">
            {{#if title}}
                {{{title}}}{{#if accent}} <span>{{{accent}}}</span>{{/if}}
            {{else}}
                Чому <span>це вигідно</span>
            {{/if}}
        </h2>

        <div class="benefits__board">
            {{!-- <div class="benefits__logo" aria-hidden="true">
                <img src="@img/logo-icon.svg" alt="" width="159" height="202" />
            </div> --}}

            <ul class="benefits__list" data-scroll-track>
                {{> @partial-block }}
            </ul>
        </div>

        {{> Ui/SliderNav light=true scroll=true }}
    </div>
</section>
