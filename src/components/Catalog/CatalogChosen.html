<div class="catalog-listing__chosen" data-catalog-chosen>
    <span class="catalog-listing__chosen-label">Ви обрали:</span>
    <ul class="catalog-listing__chips">
        <li>
            <button type="button" class="catalog-listing__chip" data-chip-remove data-chip-group="brand" data-chip-value="dahai">
                <span><span class="catalog-listing__chip-label">Бренд:</span> Dahai</span>
                <svg class="icon" width="12" height="12" aria-hidden="true">
                    <use href="@img/sprite.svg#icon-close"></use>
                </svg>
            </button>
        </li>
        <li>
            <button type="button" class="catalog-listing__chip" data-chip-remove data-chip-group="panel_type" data-chip-value="solar">
                <span><span class="catalog-listing__chip-label">Тип панелі:</span> Для сонячних станцій</span>
                <svg class="icon" width="12" height="12" aria-hidden="true">
                    <use href="@img/sprite.svg#icon-close"></use>
                </svg>
            </button>
        </li>
        <li>
            <button type="button" class="catalog-listing__chip is-accent" data-chip-remove data-chip-group="phases" data-chip-value="3">
                <span><span class="catalog-listing__chip-label">Кількість фаз:</span> Трифазні варіанти</span>
                <svg class="icon" width="12" height="12" aria-hidden="true">
                    <use href="@img/sprite.svg#icon-close"></use>
                </svg>
            </button>
        </li>
    </ul>
    <button type="button" class="catalog-listing__clear" data-catalog-clear>
        <span>Очистити фільтр</span>
        <svg class="icon" width="12" height="12" aria-hidden="true">
            <use href="@img/sprite.svg#icon-close"></use>
        </svg>
    </button>
</div>
