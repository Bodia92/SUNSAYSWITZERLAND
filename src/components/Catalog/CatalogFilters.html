<aside class="catalog-filters" data-catalog-filters aria-label="Фільтри товарів">
    <div class="catalog-filters__head">
        <h2 class="catalog-filters__heading">Фільтри</h2>
        <button type="button" class="catalog-filters__close" data-catalog-filters-close aria-label="Закрити фільтри">
            <svg class="icon" width="24" height="24" aria-hidden="true">
                <use href="@img/sprite.svg#icon-close"></use>
            </svg>
        </button>
    </div>

    <form class="catalog-filters__form" action="#" method="get" data-catalog-filters-form>
        <div class="catalog-filters__chosen-slot" data-catalog-chosen-mobile></div>

        <div class="catalog-filters__group js-catalog-filter is-open">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="true">
                <span>Ціна</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <div class="catalog-filters__price">
                    <label class="catalog-filters__price-field">
                        <span>Від</span>
                        <input class="catalog-filters__price-input" type="number" name="min_price" min="0" value="0" inputmode="numeric">
                    </label>
                    <label class="catalog-filters__price-field">
                        <span>до</span>
                        <input class="catalog-filters__price-input" type="number" name="max_price" min="0" value="0" inputmode="numeric">
                    </label>
                    <span class="catalog-filters__price-currency">грн</span>
                    <button type="submit" class="catalog-filters__price-ok" name="filter_price" value="1">OK</button>
                </div>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter is-open">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="true">
                <span>Бренд</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <label class="catalog-filters__search">
                    <svg class="icon" aria-hidden="true" width="18" height="18">
                        <use href="@img/sprite.svg#icon-search"></use>
                    </svg>
                    <input type="search" placeholder="Пошук" data-catalog-filter-search autocomplete="off">
                </label>
                <ul class="catalog-filters__list" data-catalog-filter-list>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="brand[]" value="huawei">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Huawei</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="brand[]" value="dahai" checked>
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Dahai</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="brand[]" value="ecoflow">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Ecoflow</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="brand[]" value="inter-energy">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Inter Energy</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="brand[]" value="ja-solar">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Ja Solar</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter is-open">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="true">
                <span>Тип панелі</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <ul class="catalog-filters__list">
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="panel_type[]" value="solar" checked>
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Для сонячних станцій</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="panel_type[]" value="portable">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Для портативних станцій</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter is-open">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="true">
                <span>Потужність</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <label class="catalog-filters__search">
                    <svg class="icon" aria-hidden="true" width="18" height="18">
                        <use href="@img/sprite.svg#icon-search"></use>
                    </svg>
                    <input type="search" placeholder="Пошук" data-catalog-filter-search autocomplete="off">
                </label>
                <ul class="catalog-filters__list" data-catalog-filter-list>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="power[]" value="100">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">100W</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="power[]" value="110" checked>
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">110W</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="power[]" value="120">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">120W</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="power[]" value="160">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">160W</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="power[]" value="175">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">175W</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter is-open">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="true">
                <span>Кількість фаз</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <ul class="catalog-filters__list">
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="phases[]" value="1">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Однофазний варіант</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="phases[]" value="3" checked>
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Трифазні варіанти</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter is-open">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="true">
                <span>Конструкція панелі</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <ul class="catalog-filters__list">
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="construction[]" value="bifacial">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Двосторонні (Bifacial)</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="construction[]" value="mono" checked>
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Односторонні (Mono)</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter is-open">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="true">
                <span>ККД</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <label class="catalog-filters__search">
                    <svg class="icon" aria-hidden="true" width="18" height="18">
                        <use href="@img/sprite.svg#icon-search"></use>
                    </svg>
                    <input type="search" placeholder="Пошук" data-catalog-filter-search autocomplete="off">
                </label>
                <ul class="catalog-filters__list" data-catalog-filter-list>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="efficiency[]" value="20.7">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">20,7%</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="efficiency[]" value="20" checked>
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">20%</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="efficiency[]" value="21.3">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">21,3%</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="efficiency[]" value="21.5">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">21,5%</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="efficiency[]" value="22">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">22%</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="false">
                <span>Вага</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <ul class="catalog-filters__list">
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="weight[]" value="20">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">до 20 кг</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="weight[]" value="30">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">20–30 кг</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__group js-catalog-filter">
            <button type="button" class="catalog-filters__trigger js-catalog-filter-trigger" aria-expanded="false">
                <span>Розмір</span>
                <svg class="icon catalog-filters__chevron" aria-hidden="true" width="16" height="16">
                    <use href="@img/sprite.svg#icon-arrow-down"></use>
                </svg>
            </button>
            <div class="catalog-filters__body js-catalog-filter-body">
                <ul class="catalog-filters__list">
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="size[]" value="standard">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Стандарт</span>
                        </label>
                    </li>
                    <li>
                        <label class="catalog-filters__check">
                            <input type="checkbox" name="size[]" value="large">
                            <span class="catalog-filters__check-box" aria-hidden="true"></span>
                            <span class="catalog-filters__check-text">Великий формат</span>
                        </label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="catalog-filters__actions">
            <button type="submit" class="btn btn-main catalog-filters__apply">
                <span>Застосувати</span>
            </button>
        </div>
    </form>
</aside>
