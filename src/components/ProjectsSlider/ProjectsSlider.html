<section class="section projects-slider">
    <div class="projects-slider__container">
        {{#if label}}
        <p class="projects-slider__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="projects-slider__title title">{{#if accent}}<span>{{accent}}</span> {{/if}}{{title}}</h2>
        {{/if}}

        <div class="projects-slider__wrap" data-projects-slider>
            <div class="projects-slider__slider swiper">
                <div class="swiper-wrapper">
                    {{> @partial-block }}
                </div>
            </div>

            {{> Ui/SliderNav }}
        </div>
    </div>
</section>
