<div class="swiper-slide">
    <article class="media-slide">
        {{#if image}}
        <div class="media-slide__media">
            <img src="@img/{{image}}" alt="{{title}}" width="400" height="520" />
        </div>
        {{/if}}

        {{#if title}}
        <h3 class="media-slide__title">{{title}}</h3>
        {{/if}}

        {{#if text}}
        <p class="media-slide__text">{{text}}</p>
        {{/if}}
    </article>
</div>
