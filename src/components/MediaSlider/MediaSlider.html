<section class="section media-slider{{#if modifier}} media-slider--{{modifier}}{{/if}}">
    <div class="media-slider__container">
        {{#if label}}
        <p class="media-slider__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="media-slider__title title">{{#if accent}}<span>{{accent}}</span> {{/if}}{{title}}</h2>
        {{/if}}

        <div class="media-slider__wrap" data-media-slider>
            <div class="media-slider__slider swiper">
                <div class="swiper-wrapper">
                    {{> @partial-block }}
                </div>
            </div>

            {{> Ui/SliderNav }}
        </div>
    </div>
</section>
