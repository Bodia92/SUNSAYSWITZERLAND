<section class="section ways">
    <div class="ways__container">
        {{#if label}}
        <p class="ways__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="ways__title title">{{{title}}}{{#if accent}} <span>{{{accent}}}</span>{{/if}}</h2>
        {{/if}}

        <ul class="ways__list">
            {{> @partial-block }}
        </ul>
    </div>
</section>
