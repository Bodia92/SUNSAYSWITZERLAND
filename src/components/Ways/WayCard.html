<li class="way-card">
    <a class="way-card__link" href="{{#if href}}{{href}}{{else}}#{{/if}}"{{#if popup}} data-popup-target="{{popup}}"{{/if}}>
        <div class="way-card__head">
            {{#if icon}}
            <span class="way-card__icon" aria-hidden="true">
                <img src="@img/icons/{{icon}}.svg" alt="" width="64" height="64" />
            </span>
            {{/if}}

            <span class="way-card__arrow" aria-hidden="true">
                <svg class="icon">
                    <use href="@img/sprite.svg#icon-arrow-rotate"></use>
                </svg>
            </span>
        </div>

        {{#if title}}
        <h3 class="way-card__title">{{{title}}}</h3>
        {{/if}}
    </a>
</li>
