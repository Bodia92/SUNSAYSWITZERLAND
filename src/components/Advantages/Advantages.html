<section class="section advantages">
    <div class="advantages__container" data-scroll-slider>
        {{#if label}}
        <p class="advantages__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="advantages__title title">{{title}}{{#if accent}} <span>{{accent}}</span>{{/if}}</h2>
        {{/if}}

        <ul class="advantages__list" data-scroll-track>
            {{> @partial-block }}
        </ul>

        {{> Ui/SliderNav scroll=true }}
    </div>
</section>
