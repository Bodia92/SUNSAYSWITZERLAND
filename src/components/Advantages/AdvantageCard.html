<li class="advantage-card">
    {{#if icon}}
    <span class="advantage-card__icon{{#if iconFlip}} advantage-card__icon--flip{{/if}}" aria-hidden="true">
        <img src="@img/icons/{{icon}}.svg" alt="" width="64" height="64" />
    </span>
    {{/if}}

    <div class="advantage-card__body">
        {{#if title}}
        <h3 class="advantage-card__title">{{{title}}}</h3>
        {{/if}}
        {{#if text}}
        <p class="advantage-card__text">{{{text}}}</p>
        {{/if}}
    </div>
</li>
