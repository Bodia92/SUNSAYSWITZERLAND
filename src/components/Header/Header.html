<header class="header">
    <div class="header__container">
        <a href="/" class="header__logo">
            <img src="@img/logo.svg" alt="SUNSAY NRG" width="170" height="40" />
        </a>

        <div class="header__navbar" id="mobile-menu">
            <nav class="header__nav" aria-label="Main navigation" id="mobile-nav">
                <ul class="menu">
                    <li class="menu-item"><a href="#">How it works</a></li>
                    <li class="menu-item menu-item-has-children js-header-submenu">
                        <div class="header__nav-parent">
                            <a href="#">Projects</a>
                            {{> Ui/NavChevron }}
                        </div>
                        <ul class="sub-menu js-header-submenu-body">
                            <li class="menu-item"><a href="#">Development portfolio</a></li>
                        </ul>
                    </li>
                    <li class="menu-item"><a href="#">About us</a></li>
                    <li class="menu-item"><a href="#">Insights</a></li>
                </ul>
            </nav>

            <div class="header__actions">
                <div class="header__lang">
                    <ul class="menu">
                        <li class="menu-item menu-item-has-children lang-item current-lang js-header-submenu">
                            <div class="header__nav-parent">
                                <a href="#" aria-label="Language">EN</a>
                                {{> Ui/NavChevron }}
                            </div>
                            <ul class="sub-menu js-header-submenu-body">
                                <li class="menu-item lang-item current-lang">
                                    <a href="#"><b>EN</b> — English</a>
                                </li>
                                <li class="menu-item lang-item">
                                    <a href="#"><b>DE</b> — Deutsch</a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>

                <a href="tel:+41441234567" class="header__contact">
                    <svg class="icon" aria-hidden="true">
                        <use href="@img/sprite.svg#icon-phone"></use>
                    </svg>
                    <span>+41 44 123 45 67</span>
                </a>

                <a href="#" class="header__btn btn btn-outline" data-popup-target="#contact-us">
                    <span>Contact us</span>
                    {{> Ui/ArrowIcon }}
                </a>
            </div>
        </div>

        <div class="header__tools">
            <a class="header__tool" href="tel:+41441234567" aria-label="Call">
                <svg class="icon" aria-hidden="true">
                    <use href="@img/sprite.svg#icon-phone"></use>
                </svg>
            </a>
        </div>

        <button class="header__burger js-menu-trigger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
            <span></span>
        </button>
    </div>
</header>
