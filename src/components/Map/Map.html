<section class="section map" data-present-map>
    <div class="map__container">
        <h2 class="map__title title">We are <span>present in</span></h2>

        <div class="map__viewport" data-map-viewport>
            <div class="map__canvas">
                {{> Map/EuropeSvg }}

                <ul class="map__points">
                    <li class="map__points-item" style="--x: 40.14%; --y: 52.1%;">
                        <button class="map__point" type="button" data-map-point data-name="Rico Keller" data-role="Co-founder & Board Member" data-photo="@img/user01.jpg" data-phone="+41 78 447 88 06" data-phone-href="tel:+41784478806" data-email="info@sunsay.ch" data-location="SUNSAY NRG Suisse AG, c/o Fellmann &amp; Partner AG, Grafenaustrasse 7, 6300 Zug, Switzerland" aria-expanded="false" aria-label="Switzerland — Rico Keller">
                            <span class="map__pin" aria-hidden="true">
                                <img class="map__flag" src="@img/flags/swiss.svg" alt="" width="24" height="24">
                            </span>
                        </button>
                    </li>
                    <li class="map__points-item" style="--x: 53.33%; --y: 46.66%;">
                        <button class="map__point" type="button" data-map-point data-name="Dmytro Zinkevych" data-role="Co-founder & CEO" data-photo="@img/user02.jpg" data-phone="+41 78 447 88 06" data-phone-href="tel:+41784478806" data-email="info@sunsay.ch" data-location="SUNSAY NRG Suisse AG, c/o Fellmann &amp; Partner AG, Grafenaustrasse 7, 6300 Zug, Switzerland" aria-expanded="false" aria-label="Austria — Dmytro Zinkevych">
                            <span class="map__pin" aria-hidden="true">
                                <img class="map__flag" src="@img/flags/austria.svg" alt="" width="24" height="24">
                            </span>
                        </button>
                    </li>
                    <li class="map__points-item" style="--x: 85.14%; --y: 30.32%;">
                        <button class="map__point" type="button" data-map-point data-name="Dmytro Zinkevych" data-role="Co-founder & CEO" data-photo="@img/user02.jpg" data-phone="+41 78 447 88 06" data-phone-href="tel:+41784478806" data-email="info@sunsay.ch" data-location="SUNSAY NRG Suisse AG, c/o Fellmann &amp; Partner AG, Grafenaustrasse 7, 6300 Zug, Switzerland" aria-expanded="false" aria-label="Ukraine — Dmytro Zinkevych">
                            <span class="map__pin" aria-hidden="true">
                                <img class="map__flag" src="@img/flags/ukraine.svg" alt="" width="24" height="24">
                            </span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>

        <div class="map__popup" data-map-popup hidden aria-hidden="true">
            <button class="map__popup-close" type="button" data-map-close aria-label="Close">
                <svg class="icon" aria-hidden="true">
                    <use href="@img/sprite.svg#icon-close"></use>
                </svg>
            </button>

            <div class="map__popup-person">
                <div class="map__popup-photo">
                    <img src="@img/user02.jpg" alt="" width="64" height="64" data-map-photo>
                </div>
                <div class="map__popup-person-text">
                    <div class="map__popup-name" data-map-name>Dmytro Zinkevych</div>
                    <div class="map__popup-role" data-map-role>Co-founder &amp; CEO</div>
                </div>
            </div>

            <ul class="map__popup-list">
                <li>
                    <a class="map__popup-row" href="tel:+41784478806" data-map-phone-link>
                        <span class="map__popup-icon" aria-hidden="true">
                            <svg class="icon">
                                <use href="@img/sprite.svg#icon-phone"></use>
                            </svg>
                        </span>
                        <span class="map__popup-text">
                            <span class="map__popup-label">Phone</span>
                            <span class="map__popup-value" data-map-phone>+41 78 447 88 06</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="map__popup-row" href="mailto:info@sunsay.ch" data-map-email-link>
                        <span class="map__popup-icon" aria-hidden="true">
                            <svg class="icon">
                                <use href="@img/sprite.svg#icon-mail"></use>
                            </svg>
                        </span>
                        <span class="map__popup-text">
                            <span class="map__popup-label">Email</span>
                            <span class="map__popup-value" data-map-email>info@sunsay.ch</span>
                        </span>
                    </a>
                </li>
                <li>
                    <div class="map__popup-row">
                        <span class="map__popup-icon" aria-hidden="true">
                            <svg class="icon">
                                <use href="@img/sprite.svg#icon-location"></use>
                            </svg>
                        </span>
                        <span class="map__popup-text">
                            <span class="map__popup-label">Location</span>
                            <span class="map__popup-value" data-map-location>SUNSAY NRG Suisse AG, c/o Fellmann &amp; Partner AG, Grafenaustrasse 7, 6300 Zug, Switzerland</span>
                        </span>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</section>
