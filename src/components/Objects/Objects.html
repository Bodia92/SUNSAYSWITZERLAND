<section class="section objects">
    <div class="objects__container" data-scroll-slider>
        {{#if label}}
        <p class="objects__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="objects__title title">{{{title}}}{{#if accent}} <span>{{{accent}}}</span>{{/if}}</h2>
        {{/if}}

        <ul class="objects__list" data-scroll-track>
            {{> @partial-block }}
        </ul>

        {{> Ui/SliderNav scroll=true }}
    </div>
</section>
