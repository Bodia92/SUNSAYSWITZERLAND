<section class="section objects">
    <div class="objects__container">
        {{#if label}}
        <p class="objects__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="objects__title title">{{title}}{{#if accent}} <span>{{accent}}</span>{{/if}}</h2>
        {{/if}}

        <ul class="objects__list">
            {{> @partial-block }}
        </ul>
    </div>
</section>
