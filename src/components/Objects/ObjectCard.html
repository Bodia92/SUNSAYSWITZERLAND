<li class="object-card">
    <a class="object-card__link" href="{{#if href}}{{href}}{{else}}#{{/if}}">
        {{#if image}}
        <div class="object-card__media">
            <img src="@img/{{image}}" alt="" width="400" height="240" />
        </div>
        {{/if}}

        <div class="object-card__body">
            {{#if title}}
            <h3 class="object-card__title">{{title}}</h3>
            {{/if}}
            {{#if text}}
            <p class="object-card__text">{{text}}</p>
            {{/if}}
        </div>
    </a>
</li>
