<li class="faq__item js-faq-wrap{{#if open}} is-open{{/if}}">
    <button class="faq__trigger js-faq-trigger" type="button">
        <span class="faq__icon" aria-hidden="true">
            <svg class="icon">
                <use href="@img/sprite.svg#icon-quesiton"></use>
            </svg>
        </span>
        <span class="faq__question">{{question}}</span>
        <span class="faq__chevron arrow" aria-hidden="true">
            <svg class="icon">
                <use href="@img/sprite.svg#icon-arrow-down"></use>
            </svg>
        </span>
    </button>
    <div class="faq__answer js-faq-body">
        <div class="faq__answer-inner">
            <p>{{{answer}}}</p>
        </div>
    </div>
</li>
