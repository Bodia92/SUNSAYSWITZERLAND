<section class="section faq" id="faq" data-faq>
    <div class="faq__container">
        <h2 class="faq__title title">{{#if title}}{{{title}}}{{else}}F.A.Q.{{/if}}</h2>
        <div class="faq__text text">
            {{#if text}}{{{text}}}{{else}}Common questions from investors and partners evaluating SUNSAY NRG opportunities{{/if}}
        </div>

        <ul class="faq__list">
            {{> @partial-block }}
        </ul>

        {{#unless hideMore}}
        <div class="faq__actions">
            <button class="faq__more btn btn-outline" type="button" data-faq-more>
                <span data-faq-more-label>{{#if moreLabel}}{{moreLabel}}{{else}}Show more{{/if}}</span>
                {{> Ui/ArrowIcon }}
            </button>
        </div>
        {{/unless}}
    </div>
</section>
