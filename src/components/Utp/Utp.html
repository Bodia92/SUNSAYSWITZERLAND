<section class="section utp{{#if modifier}} utp--{{modifier}}{{/if}}">
    <div class="utp__container">
        {{#if label}}
        <p class="utp__label title-label">{{label}}</p>
        {{/if}}

        {{#if title}}
        <h2 class="utp__title title">{{{title}}}{{#if accent}} <span>{{{accent}}}</span>{{/if}}</h2>
        {{/if}}

        <ul class="utp__list">
            {{> @partial-block }}
        </ul>
    </div>
</section>
