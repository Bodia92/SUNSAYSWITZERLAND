<div id="contact-us" class="popup" aria-hidden="true">
    <div class="popup__wrapper">
        <div class="popup__content">
            <div class="popup__body">
                <button class="popup__close" data-close-popup aria-label="Закрити" type="button"></button>
                {{> Form/QuoteForm formId="popup" }}
            </div>
        </div>
    </div>
</div>

<div id="popup-success" class="popup" aria-hidden="true">
    <div class="popup__wrapper">

        <div class="popup__content">
            <button class="popup__close close-popup" data-close-popup aria-label="Close" type="button"></button>

            <div class="popup__body">
                <h2 class="popup__title">
                    Дякуємо!
                </h2>
                <div class="popup__text">
                    <p>Ми звʼяжемось з вами протягом 24 годин</p>
                </div>
                <button class="btn btn--no-icon" type="button" data-close-popup>Ок</button>
            </div>
        </div>
    </div>
</div>

<div id="includes-popup" class="popup popup--includes" aria-hidden="true">
    <div class="popup__wrapper">
        <div class="popup__content">
            <button class="popup__close" data-close-popup aria-label="Close" type="button"></button>
            <div class="includes-popup">
                <div class="includes-popup__media">
                    <img src="" alt="" data-includes-popup-image width="520" height="520">
                </div>
                <div class="includes-popup__body">
                    <h3 class="includes-popup__title" data-includes-popup-title></h3>
                    <p class="includes-popup__lead" data-includes-popup-lead></p>
                    <div class="includes-popup__text" data-includes-popup-text></div>
                    <a href="tel:+10000000000" class="includes-popup__btn btn btn-light">
                        <span>Call Now</span>
                        {{> Ui/ArrowIcon }}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="course-popup" class="popup popup--course" aria-hidden="true">
    <div class="popup__wrapper">
        <div class="popup__content">
            <button class="popup__close" data-close-popup aria-label="Close" type="button"></button>
            <div class="course-popup">
                <div class="course-popup__media">
                    <img src="" alt="" data-course-popup-image width="520" height="520">
                </div>
                <div class="course-popup__body">
                    <span class="course-popup__badge" data-course-popup-badge></span>
                    <h3 class="course-popup__title" data-course-popup-title></h3>
                    <p class="course-popup__price" data-course-popup-price></p>
                    <div class="course-popup__text" data-course-popup-text></div>
                    <div class="course-popup__actions">
                        <a href="#" class="btn btn-main" data-popup-target="#contact-us">
                            <span>Book now</span>
                            {{> Ui/ArrowIcon }}
                        </a>
                        <a href="tel:+0000000000" class="btn btn-secondary">
                            <span>+000 000 00</span>
                            {{> Ui/ArrowIcon }}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="review-popup" class="popup popup--review" aria-hidden="true">
    <div class="popup__wrapper">
        <div class="popup__content">
            <button class="popup__close" data-close-popup aria-label="Закрити" type="button"></button>
            <div class="review-popup">
                <div class="review-popup__head">
                    <span class="review-popup__avatar" data-review-popup-avatar hidden></span>
                    <span class="review-popup__brand" data-review-popup-brand hidden></span>
                </div>
                <h3 class="review-popup__name" data-review-popup-name></h3>
                <p class="review-popup__role" data-review-popup-role hidden></p>
                <div class="review-popup__text" data-review-popup-text></div>
            </div>
        </div>
    </div>
</div>
