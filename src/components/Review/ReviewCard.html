<article class="review-card">
    <div class="review-card__head">
        {{#if avatar}}
        <span class="review-card__avatar">
            <img src="@img/{{avatar}}" alt="{{name}}" width="80" height="80" />
        </span>
        {{/if}}

        {{#if brand}}
        <span class="review-card__brand">
            <img src="@img/{{brand}}" alt="" />
        </span>
        {{/if}}
    </div>

    {{#if name}}
    <h3 class="review-card__name">{{name}}</h3>
    {{/if}}

    {{#if role}}
    <p class="review-card__role">{{role}}</p>
    {{/if}}

    {{#if text}}
    <p class="review-card__text">{{text}}</p>
    {{/if}}

    <button class="review-card__more" type="button" data-review-trigger data-review-name="{{name}}"
        data-review-service="{{role}}" data-review-media="none">
        <span>{{#if more}}{{more}}{{else}}Читати повністю{{/if}}</span>
        {{> Ui/ArrowIcon }}
    </button>
</article>
