<form class="contact-form" action="#" method="post" id="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}">
    <div class="form-body">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-name">Ваше ім’я</label>
                <input class="form-input" type="text" name="your-name"
                    id="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-name" placeholder="Андрій" autocomplete="name">
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-phone">Номер телефону <span>*</span></label>
                <input class="form-input" type="tel" name="your-phone"
                    id="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-phone" placeholder="+38 00 000 00 00"
                    autocomplete="tel" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-project">Назва проєкту <span>*</span></label>
                <input class="form-input" type="text" name="your-project"
                    id="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-project" placeholder="Назва проєкту" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-date">Дата монтажу <span>*</span></label>
                <input class="form-input" type="text" name="your-install-date"
                    id="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-date" placeholder="Наприклад, 12.03.2024" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-message">Коментар</label>
            <textarea class="form-input" name="your-message"
                id="{{#if formId}}{{formId}}{{else}}diagnostic-form{{/if}}-message" rows="4"
                placeholder="Напишіть"></textarea>
        </div>
    </div>

    <p class="contact-form__consent">
        Натискаючи кнопку «Надіслати повідомлення», я погоджуюся з
        <a href="privacy-policy.html">Політикою конфіденційності</a>
        та даю згоду на обробку моїх персональних даних.
    </p>

    <div class="form-actions">
        <button type="submit" class="btn btn-main">
            <span>Надіслати</span>
            {{> Ui/ArrowIcon }}
        </button>
    </div>
</form>
