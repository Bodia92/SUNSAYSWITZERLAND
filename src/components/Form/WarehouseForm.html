<form class="contact-form" action="#" method="post" id="{{#if formId}}{{formId}}{{else}}warehouse-form{{/if}}">
    <div class="form-body">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}warehouse-form{{/if}}-name">Ваше ім’я</label>
                <input class="form-input" type="text" name="your-name"
                    id="{{#if formId}}{{formId}}{{else}}warehouse-form{{/if}}-name" placeholder="Андрій" autocomplete="name">
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}warehouse-form{{/if}}-phone">Номер телефону <span>*</span></label>
                <input class="form-input" type="tel" name="your-phone"
                    id="{{#if formId}}{{formId}}{{else}}warehouse-form{{/if}}-phone" placeholder="+38 00 000 00 00"
                    autocomplete="tel" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="{{#if formId}}{{formId}}{{else}}warehouse-form{{/if}}-message">Коментар</label>
            <textarea class="form-input" name="your-message"
                id="{{#if formId}}{{formId}}{{else}}warehouse-form{{/if}}-message" rows="4"
                placeholder="Напишіть"></textarea>
        </div>

        <fieldset class="form-checks">
            <legend class="form-label form-checks__label">Тип об’єкту</legend>
            <div class="form-checks__list">
                <label class="form-check">
                    <input type="checkbox" name="object-type[]" value="warehouse" checked>
                    <span class="form-check__text">Склад</span>
                </label>
                <label class="form-check">
                    <input type="checkbox" name="object-type[]" value="logistics">
                    <span class="form-check__text">Логістичний центр</span>
                </label>
                <label class="form-check">
                    <input type="checkbox" name="object-type[]" value="hybrid">
                    <span class="form-check__text">Гібрид</span>
                </label>
            </div>
        </fieldset>
    </div>

    <p class="contact-form__consent">
        Натискаючи кнопку «Надіслати повідомлення», я погоджуюся з
        <a href="#">Політикою конфіденційності</a>
        та даю згоду на обробку моїх персональних даних.
    </p>

    <div class="form-actions">
        <button type="submit" class="btn btn-main">
            <span>Надіслати</span>
            {{> Ui/ArrowIcon }}
        </button>
    </div>
</form>
