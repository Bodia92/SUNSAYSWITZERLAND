<form class="contact-form" action="#" method="post" id="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}">
    <div class="form-body">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-name">Ваше ім’я</label>
                <input class="form-input" type="text" name="your-name"
                    id="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-name" placeholder="Ім’я" autocomplete="name">
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-phone">Номер телефону <span>*</span></label>
                <input class="form-input" type="tel" name="your-phone"
                    id="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-phone" placeholder="+38 00 000 00 00"
                    autocomplete="tel" required>
            </div>
        </div>

        {{#unless compact}}
        <div class="form-group">
            <label class="form-label" for="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-email">Email <span>*</span></label>
            <input class="form-input" type="email" name="your-email"
                id="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-email" placeholder="Email" autocomplete="email"
                required>
        </div>
        {{/unless}}

        <div class="form-group">
            <label class="form-label" for="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-message">{{#if messageLabel}}{{messageLabel}}{{else}}Повідомлення{{/if}}</label>
            <textarea class="form-input" name="your-message"
                id="{{#if formId}}{{formId}}{{else}}contact-form{{/if}}-message" rows="4"
                placeholder="Напишіть"></textarea>
        </div>
    </div>

    <p class="contact-form__consent">
        Натискаючи кнопку «Надіслати повідомлення», я погоджуюся з
        <a href="privacy-policy.html">Політикою конфіденційності</a>
        та даю згоду на обробку моїх персональних даних.
    </p>

    <div class="form-actions">
        <button type="submit" class="btn btn-main">
            <span>Надіслати</span>
            {{> Ui/ArrowIcon }}
        </button>
    </div>
</form>
