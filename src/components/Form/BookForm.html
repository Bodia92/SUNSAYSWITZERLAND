<form action="#" id="{{formId}}">
    <div class="form-body">
        <div class="form-group">
            <input class="form-input" type="text" name="your-name" id="{{formId}}-name" placeholder="Name" required>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <input class="form-input" type="tel" name="your-phone" id="{{formId}}-phone" placeholder="Phone Number"
                    required>
            </div>
            <div class="form-group">
                <input class="form-input" type="email" name="your-email" id="{{formId}}-email" placeholder="E mail"
                    required>
            </div>
        </div>

        <div class="form-group">
            <input class="form-input" type="text" name="your-service" id="{{formId}}-service" placeholder="Service">
        </div>

        <div class="form-group">
            <textarea class="form-input" name="your-message" id="{{formId}}-message" rows="4"
                placeholder="Message"></textarea>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-main">
            <span>Book now</span>
        </button>
        <a href="tel:+0000000000" class="btn btn-secondary">
            <span>+000 000 00</span>
        </a>
    </div>
</form>
