<form class="contact-form" action="#" method="post" id="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}">
    <div class="form-body">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-name">Ваше ім’я</label>
                <input class="form-input" type="text" name="your-name"
                    id="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-name" placeholder="Андрій" autocomplete="name">
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-phone">Номер телефону <span>*</span></label>
                <input class="form-input" type="tel" name="your-phone"
                    id="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-phone" placeholder="+38 00 000 00 00"
                    autocomplete="tel" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-company">Юр особа</label>
                <input class="form-input" type="text" name="your-company"
                    id="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-company" placeholder="Назва юридичної особи"
                    autocomplete="organization">
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-budget">Сума інвестицій</label>
                <input class="form-input" type="text" name="your-budget"
                    id="{{#if formId}}{{formId}}{{else}}finance-form{{/if}}-budget" placeholder="1 000 000 грн"
                    inputmode="decimal">
            </div>
        </div>
    </div>

    <p class="contact-form__consent">
        Натискаючи кнопку «Надіслати повідомлення», я погоджуюся з
        <a href="#">Політикою конфіденційності</a>
        та даю згоду на обробку моїх персональних даних.
    </p>

    <div class="form-actions">
        <button type="submit" class="btn btn-main">
            <span>Надіслати</span>
            {{> Ui/ArrowIcon }}
        </button>
    </div>
</form>
