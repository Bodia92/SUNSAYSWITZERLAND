<form class="contact-form" action="#" method="post" id="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}">
    <div class="form-body">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-name">Ваше ім’я</label>
                <input class="form-input" type="text" name="your-name"
                    id="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-name" placeholder="Андрій" autocomplete="name">
            </div>
            <div class="form-group">
                <label class="form-label" for="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-phone">Номер телефону <span>*</span></label>
                <input class="form-input" type="tel" name="your-phone"
                    id="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-phone" placeholder="+38 00 000 00 00"
                    autocomplete="tel" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-company">Компанія <span>*</span></label>
            <input class="form-input" type="text" name="your-company"
                id="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-company" placeholder="Назва юридичної особи"
                autocomplete="organization" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-message">Коментар</label>
            <textarea class="form-input" name="your-message"
                id="{{#if formId}}{{formId}}{{else}}quote-form{{/if}}-message" rows="4"
                placeholder="Напишіть"></textarea>
        </div>
    </div>

    <p class="contact-form__consent">
        Натискаючи кнопку «Надіслати», я погоджуюся з
        <a href="#">Політикою конфіденційності</a>
        та даю згоду на обробку моїх персональних даних.
    </p>

    <div class="form-actions">
        <button type="submit" class="btn btn-main">
            <span>Надіслати</span>
            {{> Ui/ArrowIcon }}
        </button>
    </div>
</form>
