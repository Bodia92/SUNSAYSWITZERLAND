<!doctype html>
<html lang="en">
{{> Head/Head title="404 — SUNSAY NRG" }}

<body>
    <div class="wrapper" id="main">
        {{> Header/Header}}

        <main class="page page--error">
            <section class="hero hero--error">
                <div class="hero__bg">
                    <img src="@img/hero/01.jpg" alt="" width="1920" height="1080" />
                </div>

                <div class="hero__container">
                    <p class="error__code">404</p>
                    <h1 class="hero__title">
                        Page
                        <span>not found</span>
                    </h1>
                    <p class="hero__text">This page does not exist or has been moved. Return to the homepage or get in touch with our team.</p>

                    <div class="hero__actions">
                        <a href="index.html" class="hero__action btn btn-main">
                            <span>Go home</span>
                            {{> Ui/ArrowIcon }}
                        </a>
                        <a href="#" class="hero__action btn btn-outline-white" data-popup-target="#contact-us">
                            <span>Contact us</span>
                            {{> Ui/ArrowIcon }}
                        </a>
                    </div>
                </div>
            </section>
        </main>

        {{> Footer/Footer }}
    </div>
    {{> Popup/Popup }}
</body>

</html>
